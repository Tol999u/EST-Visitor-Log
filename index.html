<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>방문자 출입대장 (Visitor Log)</title>
  <style>
    /* 보안: 텍스트 드래그 및 선택 금지 */
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Pretendard', -apple-system, sans-serif;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    
    body { background-color: #f1f5f9; padding: 24px; color: #0f172a; display: flex; gap: 24px; min-height: 100vh; }
    
    .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .form-container { flex: 1; max-width: 380px; display: flex; flex-direction: column; gap: 16px; }
    .list-container { flex: 2; display: flex; flex-direction: column; gap: 16px; }

    h2 { font-size: 20px; font-weight: 700; color: #1e293b; margin-bottom: 4px; }
    .subtitle { font-size: 12px; color: #64748b; margin-bottom: 12px; }

    label { font-size: 13px; font-weight: 600; color: #475569; display: block; margin-bottom: 4px; }
    /* 입력 필드는 텍스트 입력이 가능하도록 user-select 허용 */
    input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; margin-bottom: 12px; -webkit-user-select: auto; user-select: auto; }
    
    .btn { width: 100%; padding: 14px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; }
    .btn:active { background: #1d4ed8; }

    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 13px; }
    th { background: #f8fafc; color: #64748b; font-size: 12px; font-weight: 700; }
    
    .notice { font-size: 11px; color: #ef4444; background: #fef2f2; padding: 10px; border-radius: 6px; line-height: 1.4; }
  </style>
</head>
<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false">

  <!-- 출입자 입력 폼 -->
  <div class="card form-container">
    <div>
      <h2>📋 방문자 출입 등록</h2>
      <p class="subtitle">방문 정보를 정확히 입력해 주세요.</p>
    </div>

    <form id="visitorForm" onsubmit="addVisitor(event)">
      <div>
        <label>성함</label>
        <input type="text" id="name" required placeholder="홍길동" autocomplete="off">
      </div>
      <div>
        <label>연락처</label>
        <input type="tel" id="phone" required placeholder="010-0000-0000" autocomplete="off">
      </div>
      <div>
        <label>방문 목적 / 접견자</label>
        <input type="text" id="purpose" required placeholder="미팅 / 김철수 팀장" autocomplete="off">
      </div>
      <button type="submit" class="btn">출입 기록 등록</button>
    </form>

    <div class="notice">
      🔒 <b>보안 및 개인정보 보호 안내</b><br>
      본 화면의 기록은 임의 수정·복제가 불가능하며, 태블릿 내부 단말기에만 암호화 보관된 후 <b>30일 뒤 자동 파기</b>됩니다.
    </div>
  </div>

  <!-- 방문 기록 목록 확인 (수정 기능 없음) -->
  <div class="card list-container">
    <div>
      <h2>📂 최근 방문 기록</h2>
      <p class="subtitle">최근 30일 이내의 읽기 전용 저장 내역입니다.</p>
    </div>

    <table>
      <thead>
        <tr>
          <th>방문 일시</th>
          <th>성함</th>
          <th>연락처</th>
          <th>방문 목적</th>
        </tr>
      </thead>
      <tbody id="visitorTableBody">
        <!-- 읽기 전용 데이터 삽입 -->
      </tbody>
    </table>
  </div>

  <script>
    // 1. 보안: 단축키(F12, 소스보기, 복사) 및 개발자 도구 차단
    document.addEventListener('keydown', function(e) {
      if (
        e.keyCode === 123 || 
        (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || 
        (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83 || e.keyCode === 67))
      ) {
        e.preventDefault();
        return false;
      }
    });

    // 2. 보안: 디버그 무한 루프 (강제 조작 시 시스템 정지)
    setInterval(function() {
      (function(a){
        return (function(a){
          return (Function('debugger')());
        })(a);
      })();
    }, 1000);

    // 3. 태블릿 내부 DB(IndexedDB) 제어 로직
    let db;
    const request = indexedDB.open("VisitorLogDB_Secure", 1);

    request.onupgradeneeded = function(e) {
      db = e.target.result;
      if (!db.objectStoreNames.contains("visitors")) {
        const store = db.createObjectStore("visitors", { keyPath: "id", autoIncrement: true });
        store.createIndex("timestamp", "timestamp", { unique: false });
      }
    };

    request.onsuccess = function(e) {
      db = e.target.result;
      cleanOldLogs(); // 30일 경과 자동 파기
      loadVisitors(); // 읽기 전용 출력
    };

    function addVisitor(e) {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const phone = document.getElementById('phone').value;
      const purpose = document.getElementById('purpose').value;
      const now = new Date();

      const visitorData = {
        name: name,
        phone: phone,
        purpose: purpose,
        timestamp: now.getTime(),
        dateStr: now.toLocaleString('ko-KR')
      };

      const tx = db.transaction("visitors", "readwrite");
      const store = tx.objectStore("visitors");
      store.add(visitorData);

      tx.oncomplete = function() {
        document.getElementById('visitorForm').reset();
        loadVisitors();
        alert('출입 기록이 등록되었습니다.');
      };
    }

    // 30일 경과 파기 세팅
    function cleanOldLogs() {
      const tx = db.transaction("visitors", "readwrite");
      const store = tx.objectStore("visitors");
      const index = store.index("timestamp");

      const thirtyDaysMs = 30 * 24 * 60 * 60 * 1000;
      const cutoffTime = Date.now() - thirtyDaysMs;

      const range = IDBKeyRange.upperBound(cutoffTime);
      const request = index.openCursor(range);

      request.onsuccess = function(e) {
        const cursor = e.target.result;
        if (cursor) {
          store.delete(cursor.primaryKey);
          cursor.continue();
        }
      };
    }

    // 데이터 불러오기 (수정/삭제 버튼 없음)
    function loadVisitors() {
      const tbody = document.getElementById('visitorTableBody');
      tbody.innerHTML = '';

      const tx = db.transaction("visitors", "readonly");
      const store = tx.objectStore("visitors");
      const request = store.getAll();

      request.onsuccess = function() {
        const list = request.result.reverse();
        list.forEach(v => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${v.dateStr}</td>
            <td><b>${escapeHtml(v.name)}</b></td>
            <td>${escapeHtml(v.phone)}</td>
            <td>${escapeHtml(v.purpose)}</td>
          `;
          tbody.appendChild(tr);
        });
      };
    }

    // XSS 스크립트 공격 방지 텍스트 인코딩
    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
