<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>방문자 출입대장 (Visitor Log)</title>
  <style>
    * { 
      box-sizing: border-box; margin: 0; padding: 0; 
      font-family: 'Pretendard', -apple-system, sans-serif;
      -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    
    body { 
      background-color: #f1f5f9; 
      color: #0f172a; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      padding: 20px;
      position: relative; 
    }
    
    /* 태블릿 중앙 단일 카드 레이아웃 */
    .card { 
      background: white; 
      border-radius: 20px; 
      padding: 36px; 
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08); 
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h2 { font-size: 24px; font-weight: 800; color: #0f172a; margin-bottom: 4px; text-align: center; }
    .subtitle { font-size: 13px; color: #64748b; text-align: center; }

    label { font-size: 14px; font-weight: 700; color: #334155; display: block; margin-bottom: 6px; }
    input { 
      width: 100%; 
      padding: 14px 16px; 
      border: 1px solid #cbd5e1; 
      border-radius: 10px; 
      font-size: 16px; 
      margin-bottom: 16px; 
      background: #f8fafc;
      -webkit-user-select: auto; 
      user-select: auto; 
    }
    input:focus { outline: none; border-color: #2563eb; background: white; }
    
    .btn { 
      width: 100%; 
      padding: 16px; 
      background: #2563eb; 
      color: white; 
      border: none; 
      border-radius: 10px; 
      font-size: 17px; 
      font-weight: 700; 
      cursor: pointer; 
      margin-top: 8px;
    }
    .btn:active { background: #1d4ed8; transform: scale(0.99); }

    .notice { 
      font-size: 12px; 
      color: #ef4444; 
      background: #fef2f2; 
      padding: 12px; 
      border-radius: 8px; 
      line-height: 1.5; 
      text-align: center;
    }

    /* 우측 하단 귀퉁이 작은 관리자 버튼 */
    .btn-admin-corner {
      position: fixed;
      bottom: 12px;
      right: 12px;
      background: transparent;
      color: #cbd5e1;
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 8px;
      opacity: 0.5;
      transition: opacity 0.2s;
    }
    .btn-admin-corner:hover { opacity: 1; }

    /* 관리자 전용 전체화면 모달 (평상시 완전히 숨김) */
    .admin-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .admin-modal-content {
      background: white;
      width: 100%;
      max-width: 800px;
      height: 85vh;
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
    }
    .admin-header { display: flex; justify-content: space-between; align-items: center; }
    .btn-excel { padding: 10px 16px; background: #16a34a; color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .btn-close { padding: 10px 16px; background: #64748b; color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
    
    .table-wrapper { flex: 1; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 13px; }
    th { background: #f8fafc; color: #64748b; position: sticky; top: 0; font-weight: 700; }
  </style>
</head>
<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false">

  <!-- 방문자 전용 화면 (입력 폼만 깔끔하게 구성) -->
  <div class="card">
    <div>
      <h2>📋 방문자 출입 등록</h2>
      <p class="subtitle">방문 정보를 정확히 입력해 주세요.</p>
    </div>

    <form id="visitorForm" onsubmit="addVisitor(event)">
      <div>
        <label>성함</label>
        <input type="text" id="name" required placeholder="성함을 입력하세요" autocomplete="off">
      </div>
      <div>
        <label>연락처</label>
        <input type="tel" id="phone" required placeholder="010-0000-0000" autocomplete="off">
      </div>
      <div>
        <label>방문 목적 / 접견자</label>
        <input type="text" id="purpose" required placeholder="예: 미팅 / 김철수 팀장" autocomplete="off">
      </div>
      <button type="submit" class="btn">출입 기록 등록</button>
    </form>

    <div class="notice">
      🔒 수집된 방문 정보는 태블릿 내부에 안전하게 보관되며,<br><b>30일 후 자동으로 영구 파기</b>됩니다.
    </div>
  </div>

  <!-- 우측 최하단 귀퉁이 아이콘 버튼 -->
  <button class="btn-admin-corner" onclick="openAdminModal()" title="관리자">⚙️</button>

  <!-- 관리자 전용 데이터 조회 & 엑셀 모달 팝업 -->
  <div class="admin-modal" id="adminModal">
    <div class="admin-modal-content">
      <div class="admin-header">
        <div>
          <h2>📂 방문자 기록 관리</h2>
          <p class="subtitle">최근 30일간 내장 DB에 저장된 읽기 전용 출입 내역입니다.</p>
        </div>
        <div style="display: flex; gap: 8px;">
          <button class="btn-excel" onclick="exportToExcel()">📊 엑셀(CSV) 다운로드</button>
          <button class="btn-close" onclick="closeAdminModal()">닫기</button>
        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>방문 일시</th>
              <th>성함</th>
              <th>연락처</th>
              <th>방문 목적</th>
            </tr>
          </thead>
          <tbody id="visitorTableBody">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // 보안 (우클릭, 단축키, 디버거 차단)
    document.addEventListener('keydown', e => {
      if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && [73, 74, 67].includes(e.keyCode)) || (e.ctrlKey && [85, 83, 67].includes(e.keyCode))) {
        e.preventDefault(); return false;
      }
    });
    setInterval(() => { (function(){ return Function('debugger')(); })(); }, 1000);

    let db;
    let cachedList = [];

    const request = indexedDB.open("VisitorLogDB_Single", 1);
    request.onupgradeneeded = e => {
      db = e.target.result;
      if (!db.objectStoreNames.contains("visitors")) {
        const store = db.createObjectStore("visitors", { keyPath: "id", autoIncrement: true });
        store.createIndex("timestamp", "timestamp", { unique: false });
      }
    };
    request.onsuccess = e => {
      db = e.target.result;
      cleanOldLogs();
    };

    function addVisitor(e) {
      e.preventDefault();
      const visitorData = {
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        purpose: document.getElementById('purpose').value,
        timestamp: Date.now(),
        dateStr: new Date().toLocaleString('ko-KR')
      };

      const tx = db.transaction("visitors", "readwrite");
      tx.objectStore("visitors").add(visitorData);
      tx.oncomplete = () => {
        document.getElementById('visitorForm').reset();
        alert('출입 기록이 성공적으로 등록되었습니다.');
      };
    }

    function cleanOldLogs() {
      const tx = db.transaction("visitors", "readwrite");
      const store = tx.objectStore("visitors");
      const cutoffTime = Date.now() - (30 * 24 * 60 * 60 * 1000);
      const index = store.index("timestamp");
      const req = index.openCursor(IDBKeyRange.upperBound(cutoffTime));
      
      req.onsuccess = e => {
        const cursor = e.target.result;
        if (cursor) { store.delete(cursor.primaryKey); cursor.continue(); }
      };
    }

    // 귀퉁이 버튼 클릭 시 관리자 인증
    function openAdminModal() {
      const password = prompt("관리자 비밀번호를 입력하세요:");
      if (password === "dltmxm1") {
        loadVisitors();
        document.getElementById('adminModal').style.display = "flex";
      } else if (password !== null) {
        alert("비밀번호가 일치하지 않습니다.");
      }
    }

    function closeAdminModal() {
      document.getElementById('adminModal').style.display = "none";
    }

    function loadVisitors() {
      const tbody = document.getElementById('visitorTableBody');
      tbody.innerHTML = '';

      const tx = db.transaction("visitors", "readonly");
      const req = tx.objectStore("visitors").getAll();

      req.onsuccess = () => {
        cachedList = req.result.reverse();
        cachedList.forEach(v => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${v.dateStr}</td>
            <td><b>${escapeHtml(v.name)}</b></td>
            <td>${escapeHtml(v.phone)}</td>
            <td>${escapeHtml(v.purpose)}</td>
          `;
          tbody.appendChild(tr);
        });
      };
    }

    function exportToExcel() {
      if (cachedList.length === 0) {
        alert("다운로드할 방문 기록이 없습니다.");
        return;
      }

      let csvContent = "\uFEFF일시,성함,연락처,방문목적\n";
      cachedList.forEach(v => {
        csvContent += `"${v.dateStr}","${v.name}","${v.phone}","${v.purpose}"\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      
      const filename = `방문자출입대장_${new Date().toISOString().slice(0,10)}.csv`;
      link.setAttribute("href", url);
      link.setAttribute("download", filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
